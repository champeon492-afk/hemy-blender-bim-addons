name: Build Blender add-ons

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m compileall -q hemy_ifc_panel bonsai_ux_host bonsai_section_box bonsai_plan_dimensions bonsai_dynamic_dimension bonsai_grid_toolbar bonsai_nucleus_files bonsai_nucleus_sync bonsai_slab_thickness bonsai_storey_toolbar workplane_toolkit scripts/package.py scripts/build_bim_ux_startup.py
      - name: Build ZIPs
        run: python scripts/package.py
      - name: Verify package contents
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from scripts.package import ADDONS, EXTENSIONS
          for addon in ADDONS:
              with ZipFile(f'dist/{addon}.zip') as archive:
                  names = archive.namelist()
                  if addon in EXTENSIONS:
                      assert '__init__.py' in names
                      assert 'blender_manifest.toml' in names
                  else:
                      assert f'{addon}/__init__.py' in names
                      assert all(name.startswith(f'{addon}/') for name in names)
                  assert archive.testzip() is None
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: blender-addons
          path: dist/*.zip
